name: sphone
description: "sPhone — l'écran du téléphone Android sur le PC"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  shared_preferences: ^2.5.6
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    # Icônes de la fenêtre d'affichage : scrcpy les lit directement sur le disque
    # (variable SCRCPY_ICON_DIR), les noms de fichiers sont donc imposés.
    - assets/mirror/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit_300Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit_600SemiBold.ttf
          weight: 600
